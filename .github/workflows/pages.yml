name: Deploy RentMatch to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "RentMatch/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RentMatch/package-lock.json

      - name: Install dependencies
        working-directory: RentMatch
        run: npm ci

      - name: Build static preview
        working-directory: RentMatch
        run: npm run build:pages
        env:
          VITE_STATIC_PREVIEW: "true"
          GITHUB_ACTIONS: "true"

      - name: Copy listing photos
        run: cp -R RentMatch/wwwroot/Images RentMatch/dist/Images

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: RentMatch/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
